version: "3.8"

services:
  aegis-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AEGIS_HOST=0.0.0.0
      - AEGIS_PORT=8080
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - AEGIS_POLICY_PATH=/app/config/default_policy.yaml
      - AEGIS_AUDIT_LOG=/app/logs/audit.jsonl
    volumes:
      - ./config:/app/config:ro
      - aegis_logs:/app/logs

volumes:
  aegis_logs:
    driver: local
